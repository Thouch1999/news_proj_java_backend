<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verification code</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;padding:32px;">
                <tr>
                    <td style="font-size:20px;font-weight:bold;color:#222;">Verify your email</td>
                </tr>
                <tr>
                    <td style="padding:16px 0;font-size:14px;color:#555;">
                        Use the code below to verify your email address and continue registration.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:16px 0;">
                        <span th:text="${otpCode}"
                              style="display:inline-block;font-size:32px;letter-spacing:8px;font-weight:bold;color:#1a56db;background:#eef2ff;padding:12px 24px;border-radius:6px;">123456</span>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:13px;color:#888;">
                        This code expires in <span th:text="${ttlMinutes}">3</span> minute(s).
                        If you did not request it, you can ignore this email.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
